        '200': { description: Permission-scoped, filtered, and stably paginated moderation appeal queue, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminGovernanceAppeal' } }, nextCursor: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/governance/appeals/{appealId}/resolve:
    post:
      tags: [Admin]
