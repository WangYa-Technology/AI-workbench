        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [commandId, expectedJobId, reason, confirmed]
              properties:
                commandId: { type: string, format: uuid }
                expectedJobId: { type: string, format: uuid }
                reason: { type: string, minLength: 10, maxLength: 1000 }
                confirmed: { type: boolean, enum: [true] }
