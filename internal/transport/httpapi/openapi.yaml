  /admin/product-disputes:
    get:
      tags: [Admin]
      operationId: listProductPaymentDisputes
      security: [{ sessionCookie: [] }]
      description: Requires active admin:finance authority, rechecked under a database lock. Private directory ordered by won-last priority, dueBy and ID. Unknown or repeated query parameters are rejected. Cursors are opaque and bound to the normalized filters; changing filters requires restarting pagination.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 }, description: Product title or handle substring; exact local dispute or provider reference match. }
        - { name: actionStatus, in: query, schema: { $ref: '#/components/schemas/ProductDisputeActionStatus' } }
        - { name: reviewStatus, in: query, schema: { $ref: '#/components/schemas/ProductDisputeReviewStatus' } }
        - { name: binding, in: query, schema: { type: string, enum: [bound, unbound] } }
        - { name: mode, in: query, schema: { type: string, enum: [live, test] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Private dispute directory, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPaymentDisputePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/product-disputes/{disputeID}:
    parameters:
      - { name: disputeID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin]
      operationId: getProductPaymentDispute
      security: [{ sessionCookie: [] }]
      description: Requires active admin:finance authority. Returns current state, provider event history and immutable operation/evidence history. Query parameters are rejected. Provider references and party identifiers are private; clients should display only necessary operational information, never raw provider payloads.
      responses:
        '200': { description: Dispute detail, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPaymentDisputeDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/product-disputes/{disputeID}/operations:
    parameters:
      - { name: disputeID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: operateProductPaymentDispute
      security: [{ sessionCookie: [] }]
      description: >-
        Requires active admin:finance authority. Exactly one Idempotency-Key and no query parameters.
        Atomically records the operation, optional evidence reference, version increment and audit.
        Does not submit to the provider, adjudicate the dispute, release funds or change payment/order status.
        Same operator/key and normalized payload replay returns the original operationId with CURRENT detail.
        Same key with changed payload/dispute, stale version, requesting already submitted evidence or recording evidence before requesting it returns 409.
        A response loss must be retried with the same key and body. All current authority checks still apply to replay.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPaymentDisputeCommand' }
      responses:
        '200': { description: Committed or replayed operation with current detail, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPaymentDisputeCommandResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/seller-payout-requests:
