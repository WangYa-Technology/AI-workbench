      type: object
      required: [id, name, url, eventTypes, status, currentSecretVersion, secretHint, version, createdAt, updatedAt, deliveries]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        eventTypes: { type: array, items: { type: string, enum: [developer.webhook.test, generation.completed, work.published, marketplace.order.fulfilled, marketplace.order.refunded] } }
        status: { type: string, enum: [active, revoked] }
        currentSecretVersion: { type: integer, minimum: 1 }
        secretHint: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        deliveries: { type: array, items: { $ref: '#/components/schemas/DeveloperWebhookDelivery' } }
