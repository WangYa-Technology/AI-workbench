        - { name: status, in: query, schema: { $ref: '#/components/schemas/SupportStatus' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/SupportCategory' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable priority cursor }
      responses:
        '200':
          description: Permission-scoped support operations queue
          content:
            application/json:
              schema:
                type: object
