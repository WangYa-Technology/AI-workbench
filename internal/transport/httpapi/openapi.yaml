        attemptedAt: { type: string, format: date-time }
    DeveloperWebhookDelivery:
      type: object
      required: [id, endpointId, endpointName, endpointHost, eventId, eventType, status, version, attemptCount, createdAt, updatedAt, attempts]
      properties:
        id: { type: string, format: uuid }
        endpointId: { type: string, format: uuid }
        endpointName: { type: string }
        endpointHost: { type: string }
        ownerHandle: { type: string }
        eventId: { type: string, format: uuid }
