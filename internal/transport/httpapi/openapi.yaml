openapi: 3.1.0
info:
  title: HCAI CHAT API
  version: 0.2.0
  description: >-
    Contract for the international-first HCAI CHAT platform. Unsafe browser
    requests are checked for cross-origin forgery before business handlers run;
    rejected requests return 403 with error.code cross_origin_request. The
    configured WEB_ORIGIN is trusted. GET, HEAD and OPTIONS remain safe methods.
    Clients without browser Origin/Fetch Metadata headers remain subject to the
    normal endpoint authentication. Exact POST payment-webhook routes retain
    their independent signed-payload authentication instead of browser checks.
servers:
  - url: /api/v1
tags:
  - name: Runtime
  - name: Identity
  - name: Data Rights
  - name: Discovery
  - name: Creation
  - name: Assets
  - name: Community
  - name: Marketplace
  - name: Tasks
  - name: Notifications
  - name: Support
  - name: Billing
  - name: Payments
  - name: Developer
  - name: Admin
paths:
  /task-types:
    get:
      tags: [Community, Marketplace, Tasks]
      operationId: listCategories
      parameters:
        - { $ref: '#/components/parameters/CategoryScope' }
      responses:
        '200':
          description: Categories ordered by sortOrder and code
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ContentCategory' } } } }
  /admin/task-types:
    post:
      tags: [Admin]
      operationId: createCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CategoryScope' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentCategory' }
      responses:
        '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/ContentCategory' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/task-types/{code}:
    parameters:
      - { $ref: '#/components/parameters/CategoryScope' }
      - { name: code, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Admin]
      operationId: updateCategory
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentCategory' }
      responses:
        '200': { description: Category renamed or reordered, content: { application/json: { schema: { $ref: '#/components/schemas/ContentCategory' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Admin]
      operationId: deleteCategory
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { replacement: { type: string, description: Same-scope category required when content references the source } } }
      responses:
        '200': { description: References transferred atomically and category physically deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/content-category:
    get:
      tags: [Admin]
      operationId: listCategoryContent
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CategoryScope' }
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Content available for classification, 50 items per page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  nextCursor: { type: string }
                  items: { type: array, items: { type: object, required: [id, title, category], properties: { id: { type: string, format: uuid }, title: { type: string }, category: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/content-category/{id}:
    patch:
      tags: [Admin]
      operationId: assignContentCategory
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CategoryScope' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [category], properties: { category: { type: string } } }
      responses:
        '200': { description: Content assigned to a category in its own directory }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /:
    get:
      tags: [Developer]
      operationId: getDeveloperAPIContract
      security: [{ bearerApiKey: [] }]
      responses:
        '200': { description: Stable Developer API v1 contract envelope }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /principal:
    get:
      tags: [Developer]
      operationId: getDeveloperAPIPrincipal
      security: [{ bearerApiKey: [] }]
      responses:
        '200': { description: Authenticated Service Account principal envelope }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /errors:
    get:
      tags: [Developer]
      operationId: getDeveloperAPIErrorRegistry
      security: [{ bearerApiKey: [] }]
      responses:
        '200': { description: Stable Developer API v1 error registry envelope }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /meta:
    get:
      tags: [Runtime]
      operationId: getMeta
      responses:
        '200':
          description: Public runtime metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /site-config:
    get:
      tags: [Runtime]
      operationId: getSiteConfiguration
      responses:
        '200':
          description: Public branding, footer, and policy configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteConfiguration'
  /payments/webhooks/stripe:
    post:
      tags: [Payments]
      operationId: receiveStripeWebhook
      description: Receives a bounded, signed Stripe event using the retained deployment verifier, API version and environment. Known product payment and refund events are matched to the original local payment independently of new-sales provider selection; the worker rechecks that binding before applying funds or rights. Financial events carrying a Connect account or organization context are rejected because outbound charges use the platform account; valid connected-account status updates remain supported. Other events retain the enabled-provider routing policy. The global payment-processing switch remains mandatory. This does not recover missing original merchant credentials or permit changing the signing secret to another account.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 4096 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Duplicate event safely acknowledged, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentWebhookReceipt' } } } }
        '202': { description: Signed event accepted for idempotent processing, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentWebhookReceipt' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /payments/webhooks/waffo:
    post:
      tags: [Payments]
      operationId: receiveWaffoWebhook
      description: Receives a bounded Waffo Pancake event. The isolated connector attests to the exact raw-body digest and deployment environment. Product events must match the immutable original store, buyer, order, resource and amount, independently of current new-sales settings. The binding is persisted with the event and rechecked before processing. Missing original evidence requires reconciliation; signature verification and the global processing switch remain mandatory.
      parameters:
        - name: x-waffo-signature
          in: header
          required: true
          schema: { type: string, maxLength: 4096 }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Duplicate event safely acknowledged, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentWebhookReceipt' } } } }
        '202': { description: Signed event accepted for idempotent processing, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentWebhookReceipt' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/ValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/session:
    get:
      tags: [Identity]
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags: [Identity]
      operationId: registerAccount
      deprecated: true
      description: Legacy test-fixture registration. Outside APP_ENV=test use /auth/unified/register with an email code.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '201':
          description: Account and hashed-cookie session created
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '410': { description: Email verification registration required }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/login:
    post:
      tags: [Identity]
      operationId: loginAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: Email and password session created
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/unified/start:
    post:
      tags: [Identity]
      operationId: startUnifiedAuthentication
      description: Identifies the email branch. Unknown emails receive a registration code challenge; existing accounts continue to password or email-code sign-in.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnifiedAuthStartRequest' } } }
      responses:
        '200':
          description: Unified authentication branch and optional registration challenge
          content: { application/json: { schema: { $ref: '#/components/schemas/UnifiedAuthStartResponse' } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/AuthCodeResendLimited' }
  /auth/unified/send-code:
    post:
      tags: [Identity]
      operationId: sendUnifiedAuthCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnifiedAuthCodeRequest' } } }
      responses:
        '202': { description: Code email queued, content: { application/json: { schema: { type: object, required: [challenge], properties: { challenge: { $ref: '#/components/schemas/AuthChallenge' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/AuthCodeResendLimited' }
  /auth/unified/login-code:
    post:
      tags: [Identity]
      operationId: confirmUnifiedLoginCode
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnifiedAuthConfirmRequest' } } }
      responses:
        '200': { description: Email-code session created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { description: Code expired }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/unified/register:
    post:
      tags: [Identity]
      operationId: completeUnifiedRegistration
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnifiedAuthRegisterRequest' } } }
      responses:
        '201': { description: Verified account and session created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: Code expired }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/logout:
    post:
      tags: [Identity]
      operationId: endSession
      responses:
        '204':
          description: Session ended
  /auth/password-reset-requests:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      description: Always accepts the request without revealing whether the email belongs to an active account.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '202': { description: Request accepted without an account-existence signal }
  /auth/password-reset-confirm:
    post:
      tags: [Identity]
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } } }
      responses:
        '200': { description: Password replaced, all sessions revoked, and the one-time token erased }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Email action expired }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/email-verification/confirm:
    post:
      tags: [Identity]
      operationId: confirmEmailVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailActionToken' } } }
      responses:
        '204': { description: Email verified and one-time token erased }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Email action expired }
  /account/profile:
    patch:
      tags: [Identity]
      operationId: updateProfile
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } }
      responses:
        '200':
          description: Current profile updated with audit evidence
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /account/payouts:
    get:
      tags: [Payments]
      operationId: getPayoutStatus
      security: [{ sessionCookie: [] }]
      description: Returns minimized owner-scoped Stripe Connect payout onboarding evidence. Identity, bank, and requirement details are never returned.
      responses:
        '200':
          description: Current creator payout onboarding state
          content: { application/json: { schema: { $ref: '#/components/schemas/PayoutStatus' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /account/payouts/onboarding:
    post:
      tags: [Payments]
      operationId: beginPayoutOnboarding
      security: [{ sessionCookie: [] }]
      description: Creates a short-lived, single-use Stripe-hosted Connect onboarding link for the authenticated creator.
      responses:
        '201':
          description: Hosted onboarding link created; the URL is returned only to the authenticated owner.
          content: { application/json: { schema: { $ref: '#/components/schemas/PayoutOnboardingLink' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /account/email-actions:
    get:
      tags: [Identity]
      operationId: listAccountEmailActions
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable owner identity-email-action cursor }
      responses:
        '200':
          description: Safe delivery and lifecycle evidence for the current account; token material is never returned.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/IdentityEmailAction' } }, nextCursor: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /account/email-verification:
    post:
      tags: [Identity]
      operationId: requestEmailVerification
      security: [{ sessionCookie: [] }]
      responses:
        '202': { description: Durable verification action queued, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEmailAction' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Email is already verified }
  /account/sessions:
    get:
      tags: [Identity]
      operationId: listAccountSessions
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable account-session cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Current account sessions with safe device and network hints
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSessionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /account/sessions/{sessionId}:
    delete:
      tags: [Identity]
      operationId: revokeAccountSession
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: Owned session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/sessions/revoke-others:
    post:
      tags: [Identity]
      operationId: revokeOtherAccountSessions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: All other active sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revokedCount]
                properties: { revokedCount: { type: integer, minimum: 0 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /account/developer-access:
    get:
      tags: [Developer]
      operationId: getDeveloperAccess
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Personal control state and safe credential inventory, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperAccess' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /account/developer-service-accounts:
    post:
      tags: [Developer]
      operationId: createDeveloperServiceAccount
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperServiceAccountCreate' } } } }
      responses:
        '201': { description: Service Account created, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperServiceAccount' } } } }
        '503': { description: Developer Access is disabled }
  /account/developer-service-accounts/{accountId}/revoke:
    post:
      tags: [Developer]
      operationId: revokeDeveloperServiceAccount
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/DeveloperAccountId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperTransition' } } } }
      responses:
        '200': { description: Service Account and active keys revoked, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperServiceAccount' } } } }
  /account/developer-service-accounts/{accountId}/keys:
    post:
      tags: [Developer]
      operationId: issueDeveloperAPIKey
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/DeveloperAccountId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperKeyCreate' } } } }
      responses:
        '201': { description: API key issued with one-time plaintext, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredential' } } } }
  /account/developer-service-accounts/{accountId}/keys/{keyId}/rotate:
    post:
      tags: [Developer]
      operationId: rotateDeveloperAPIKey
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/DeveloperAccountId' }, { $ref: '#/components/parameters/DeveloperKeyId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperKeyRotate' } } } }
      responses:
        '201': { description: Replacement API key issued and predecessor invalidated, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperCredential' } } } }
  /account/developer-service-accounts/{accountId}/keys/{keyId}/revoke:
    post:
      tags: [Developer]
      operationId: revokeDeveloperAPIKey
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/DeveloperAccountId' }, { $ref: '#/components/parameters/DeveloperKeyId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperTransition' } } } }
      responses:
        '200': { description: API key revoked, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperAPIKey' } } } }
  /account/developer-webhooks:
    get:
      tags: [Developer]
      operationId: getDeveloperWebhooks
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Owned webhook endpoints, event catalog, and delivery evidence without signing secrets, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookAccess' } } } }
    post:
      tags: [Developer]
      operationId: createDeveloperWebhook
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookCreate' } } } }
      responses:
        '201': { description: Webhook endpoint created with one-time plaintext signing secret, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookCredential' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { description: Developer Access is disabled }
  /account/developer-webhooks/{endpointId}/deliveries:
    get:
      tags: [Developer]
      operationId: listDeveloperWebhookDeliveries
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable delivery cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        '200': { description: Owned endpoint delivery evidence without signing secrets, full response bodies, or full target URLs, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookDeliveryPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /account/developer-webhooks/{endpointId}/rotate:
    post:
      tags: [Developer]
      operationId: rotateDeveloperWebhookSecret
      security: [{ sessionCookie: [] }]
      parameters: [{ name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperTransition' } } } }
      responses:
        '201': { description: New signing-secret revision created and returned once, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookCredential' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /account/developer-webhooks/{endpointId}/revoke:
    post:
      tags: [Developer]
      operationId: revokeDeveloperWebhook
      security: [{ sessionCookie: [] }]
      parameters: [{ name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperTransition' } } } }
      responses:
        '200': { description: Endpoint revoked and pending deliveries cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/DeveloperWebhookEndpoint' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /account/developer-webhooks/{endpointId}/test:
    post:
      tags: [Developer]
      operationId: testDeveloperWebhook
      security: [{ sessionCookie: [] }]
      parameters: [{ name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
