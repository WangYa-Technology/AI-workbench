        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '416': { description: Invalid byte range }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /products:
    # Business categories are independent of the fixed product/media format.
    get:
      tags: [Marketplace]
      operationId: listProducts
      description: Keyset pagination by creation time and ID, or price followed by creation time and ID. Items, total and categoryCounts share one snapshot per response; later requests re-evaluate current visibility and prices.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 48 }, description: Business category code; unknown well-formed codes return no matches. }
