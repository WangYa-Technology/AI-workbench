      tags: [Assets]
      operationId: listAssets
      security:
        - sessionCookie: []
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable Asset cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Assets owned by the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetPage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/saved-works:
    get:
      tags: [Assets]
      operationId: listSavedWorks
      description: Lists the current user's published Community bookmarks as reference-only works. Saving does not transfer Asset ownership or license rights.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable saved-work cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Visible, scan-clean saved works for the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedWorkPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/uploads:
    post:
      tags: [Assets]
      operationId: uploadAsset
      description: Stores one file through the configured private media backend and queues durable scanning. Content remains unavailable until the scan status is clean.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, file]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                file: { type: string, format: binary }
            encoding:
              file:
                contentType: image/jpeg, image/png, video/mp4, audio/wav, audio/mpeg, text/plain
      responses:
        '201': { description: Uploaded Asset persisted with pending scan status and durable scan job, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '413': { description: Upload exceeds 10 MiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AssetId' }]
      responses:
        '200':
          description: Owned asset with lineage and purchase or generation provenance
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assets/{assetId}/usages:
    get:
      tags: [Assets]
      operationId: listAssetUsages
      description: Lists owner-scoped downstream uses across the complete version family. Historical unavailable resources remain auditable without unsafe deep links.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable Asset-usage cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Stably paginated use evidence for the owned Asset family, content: { application/json: { schema: { $ref: '#/components/schemas/AssetUsagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/{assetId}/content:
    get:
      tags: [Assets]
      operationId: getAssetContent
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: Range
          in: header
          required: false
          description: One RFC 9110 byte range. Multiple ranges are rejected.
          schema: { type: string, pattern: '^bytes=[0-9]*-[0-9]*$' }
      responses:
        '200':
          description: Complete Asset media. Private assets require their owner session; published assets are public. Only scan-clean content is delivered.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            video/mp4: { schema: { type: string, contentEncoding: binary } }
            audio/wav: { schema: { type: string, contentEncoding: binary } }
            audio/mpeg: { schema: { type: string, contentEncoding: binary } }
            text/plain: { schema: { type: string, contentEncoding: binary } }
        '206':
          description: One authorized byte range from scan-clean Asset media.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Range: { schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            video/mp4: { schema: { type: string, contentEncoding: binary } }
            audio/wav: { schema: { type: string, contentEncoding: binary } }
            audio/mpeg: { schema: { type: string, contentEncoding: binary } }
            text/plain: { schema: { type: string, contentEncoding: binary } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Invalid, unsatisfiable, or multiple byte ranges.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /assets/{assetId}/versions:
    post:
      tags: [Assets]
      operationId: uploadAssetVersion
