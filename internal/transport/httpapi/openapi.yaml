    get:
      tags: [Marketplace]
      operationId: reviewProductContent
      security: [{ sessionCookie: [] }]
      description: Audited attachment download for admin:content, limited to the file referenced by the observed listing version; private, no-store. A multi-file source requires fileIndex; omitting it cannot silently review only the first file. The asset service still enforces scan and storage checks.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [source, preview] } }
        - { name: version, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: fileIndex, in: query, schema: { type: integer, minimum: 0, maximum: 19 }, description: Zero-based source member index; required for a multi-file source, forbidden for a preview. }
