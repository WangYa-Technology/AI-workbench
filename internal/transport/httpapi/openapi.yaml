                note: { type: string, minLength: 3, maxLength: 500 }
                file: { type: string, format: binary }
            encoding:
              file:
                contentType: image/jpeg, image/png, video/mp4, audio/wav, audio/mpeg, text/plain
      responses:
        '200': { description: Replayed version with the original asset ID and current scan status, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201': { description: New pending Asset version and durable scan job created, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Upload exceeds 10 MiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
