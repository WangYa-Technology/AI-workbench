        - { name: source, in: query, schema: { type: string, enum: [purchase] }, description: Filter active purchased assets before pagination; omitted means all owned assets }
        - { name: purpose, in: query, schema: { type: string, enum: [product_preview, product_source] }, description: Filter eligible independent product samples or private delivery originals before pagination; cannot be combined with source; selection alone does not publish anything }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Assets owned by the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetPage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/saved-works:
    get:
      tags: [Assets]
      operationId: listSavedWorks
      description: Lists the current user's published Community bookmarks as reference-only works. Saving does not transfer Asset ownership or license rights.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable saved-work cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Visible, scan-clean saved works for the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedWorkPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/uploads:
    post:
      tags: [Assets]
      operationId: uploadAsset
      description: Stores one file through the configured private media backend and queues durable scanning. Content remains unavailable until the scan status is clean. Account status is rechecked under the account lifecycle lock before storage writes. The same account/key and normalized title, filename, bytes and target recover the original asset without repeating storage, scan or audit. Changed content returns 409. Each failed attempt retains a separate write journal; uncertain results do not authorize file deletion.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/UploadIdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, file]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                file: { type: string, format: binary }
            encoding:
              file:
                contentType: image/jpeg, image/png, video/mp4, audio/wav, audio/mpeg, text/plain
      responses:
        '200': { description: Replayed upload with the original asset ID and current scan status, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Upload key already belongs to different file content or metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '201': { description: Uploaded Asset persisted with pending scan status and durable scan job, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Upload exceeds 10 MiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AssetId' }]
      responses:
        '200':
          description: Owned asset with lineage and purchase or generation provenance
          content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assets/{assetId}/usages:
    get:
      tags: [Assets]
