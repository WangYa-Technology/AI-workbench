                file: { type: string, format: binary }
            encoding:
              file:
                contentType: image/jpeg, image/png, video/mp4, audio/wav, audio/mpeg, text/plain
      responses:
        '201': { description: New pending Asset version and durable scan job created, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Upload exceeds 10 MiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /products:
    get:
      tags: [Marketplace]
      operationId: listProducts
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
