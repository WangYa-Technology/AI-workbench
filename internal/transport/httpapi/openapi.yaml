              required: [licenseAccepted, offerVersion]
              properties:
                licenseAccepted: { type: boolean }
                offerVersion: { type: string, pattern: '^[0-9a-f]{64}$', description: Opaque version from the displayed product. A changed offer requires review and new acceptance. }
