        endpointHost: { type: string }
        ownerHandle: { type: string }
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [developer.webhook.test, generation.completed, work.published, marketplace.order.fulfilled, marketplace.order.refunded] }
        status: { type: string, enum: [queued, delivering, retry_scheduled, succeeded, dead_letter, cancelled] }
        version: { type: integer, minimum: 1 }
        attemptCount: { type: integer, minimum: 0, maximum: 5 }
        nextAttemptAt: { type: string, format: date-time }
        lastStatusCode: { type: integer, minimum: 100, maximum: 599 }
        lastErrorCode: { type: string }
        originalDeliveryId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        succeededAt: { type: string, format: date-time }
        deadLetteredAt: { type: string, format: date-time }
        attempts: { type: array, items: { $ref: '#/components/schemas/DeveloperWebhookAttempt' } }
    DeveloperWebhookEndpoint:
      type: object
      required: [id, name, url, eventTypes, status, currentSecretVersion, secretHint, version, createdAt, updatedAt, deliveries]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        eventTypes: { type: array, items: { type: string, enum: [developer.webhook.test, generation.completed, work.published, marketplace.order.fulfilled, marketplace.order.refunded] } }
        status: { type: string, enum: [active, revoked] }
        currentSecretVersion: { type: integer, minimum: 1 }
        secretHint: { type: string }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        deliveries: { type: array, items: { $ref: '#/components/schemas/DeveloperWebhookDelivery' } }
        deliveryNextCursor: { type: string, description: Opaque cursor for older deliveries belonging to this endpoint }
    DeveloperWebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeveloperWebhookDelivery' } }
        nextCursor: { type: string }
    DeveloperWebhookCredential:
      allOf:
        - { $ref: '#/components/schemas/DeveloperWebhookEndpoint' }
        - type: object
          required: [signingSecret]
          properties: { signingSecret: { type: string, writeOnly: true } }
    DeveloperWebhookAccess:
      type: object
      required: [eventTypes, endpoints]
      properties:
        eventTypes: { type: array, items: { type: string, enum: [developer.webhook.test, generation.completed, work.published, marketplace.order.fulfilled, marketplace.order.refunded] } }
        endpoints: { type: array, items: { $ref: '#/components/schemas/DeveloperWebhookEndpoint' } }
    DeveloperWebhookCreate:
      type: object
      additionalProperties: false
      required: [name, url, eventTypes]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        url: { type: string, format: uri, minLength: 8, maxLength: 2048 }
        eventTypes: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { type: string, enum: [developer.webhook.test, generation.completed, work.published, marketplace.order.fulfilled, marketplace.order.refunded] } }
    PaymentWebhookReceipt:
      type: object
      required: [eventId, providerEventId, eventType, status, duplicate]
      properties:
        eventId: { type: string, format: uuid }
        providerEventId: { type: string }
        eventType: { type: string }
        status: { type: string, enum: [received, processing, retry_scheduled, processed, ignored, failed] }
        duplicate: { type: boolean }
    APIError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/APIError'
