  /account/data-rights/{requestId}/export:
    get:
      tags: [Data Rights]
      operationId: downloadDataExport
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/DataRightsRequestId' }]
      responses:
        '200':
          description: >-
            Private JSON export package from one repeatable-read database snapshot;
            SHA-256 appears as Base64 in Digest and Content-Digest headers.
            data.marketplace has schemaVersion 1,
            evidenceScope and data arrays for deliveryRepairs, products, listingHistory, sales, entitlements, orderEvents,
            contracts, deliverySnapshots, payments, paymentEvents, providerEvents,
            refundAttempts, refundChecks, checkoutCommands, checkoutRequests,
            checkoutDispatches, checkoutClosures, identityRecoveries, checkoutLookups
            and cleanupJobs. Buyer transaction evidence and seller sales summaries have
            separate ownership scopes. Private storage locations, payment URLs, raw
            provider payloads and staff recovery notes are excluded. No file contents
            are included. Packages are persisted atomically in parts of at most 5 MiB;
            the complete download remains one JSON file, including packages larger than 5 MiB.
            Each part and the full package are verified before any bytes are served.
            The package expires after seven days; expiry purges every part body while retaining checksum evidence.
            Preparation and streaming have a ten-minute response budget. Capacity is limited
            per process; busy responses return Retry-After and do not expose a partial file.
            Preparation is subject to configured package and temporary-storage budgets.
            A stored package exceeding a reduced server budget remains unchanged but
            cannot be downloaded until capacity is restored; no truncated download is returned.
          content: { application/json: { schema: { type: object } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Export package expired and its body was purged }
        '503': { description: 'data_export_busy or data_export_storage_unavailable includes Retry-After; data_export_too_large requires operator capacity adjustment and is not automatically retryable. No partial file is returned.' }
