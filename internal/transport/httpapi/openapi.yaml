        - { name: q, in: query, schema: { type: string, maxLength: 120 }, description: Case-insensitive resource-title, appellant, or appeal-reason search }
        - { name: type, in: query, schema: { type: string, enum: [work, post, comment] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, upheld, denied] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable pagination cursor }
