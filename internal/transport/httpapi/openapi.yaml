      responses:
        '200': { description: Appeal resolved and upheld content action reversed atomically, content: { application/json: { schema: { $ref: '#/components/schemas/AdminGovernanceAppeal' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/support/cases:
