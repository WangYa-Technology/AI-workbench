        productType: { type: string, enum: [prompt, workflow, asset, work] }
        category: { type: string, pattern: '^[a-z][a-z0-9_-]{0,47}$' }
        assetId: { type: string, format: uuid }
        previewAssetId: { type: [string, 'null'], format: uuid }
        priceCents: { type: integer, minimum: 50, maximum: 99999999 }
        currency: { type: string, pattern: '^USD$' }
        licenseCode: { type: string, minLength: 1, maxLength: 100 }
        aiDisclosure: { type: string, minLength: 1, maxLength: 2000 }
        includedFiles: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 200 }, description: One label without files; otherwise exactly the ordered real file names. Historical descriptive lists do not supply source evidence. }
