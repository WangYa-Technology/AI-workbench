      responses:
        '200': { description: Stably paginated use evidence for the owned Asset family, content: { application/json: { schema: { $ref: '#/components/schemas/AssetUsagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/{assetId}/content:
    get:
      tags: [Assets]
      operationId: getAssetContent
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: fileIndex
          in: query
          required: false
          description: Zero-based index in the accepted purchased ZIP manifest. Only one canonical decimal index is accepted; unavailable for single-file or unpurchased assets. Omitting it downloads the whole asset. All bundle members are verified even for a range of one file.
          schema: { type: integer, minimum: 0, maximum: 19 }
        - name: Range
          in: header
          required: false
          description: One RFC 9110 byte range. Multiple ranges are rejected.
          schema: { type: string, pattern: '^bytes=[0-9]*-[0-9]*$' }
      responses:
        '200':
          description: Complete Asset media or one accepted ZIP member. Purchased packages and members require the active buyer and entitlement, clean scans for every accepted source, and a ready verified snapshot. They are attachment downloads with private/no-store caching.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, minimum: 0 } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Content-Disposition: { schema: { type: string }, description: Attachment with a safe accepted filename for a purchased ZIP or member. }
          content:
            application/zip: { schema: { type: string, contentEncoding: binary } }
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            video/mp4: { schema: { type: string, contentEncoding: binary } }
            audio/wav: { schema: { type: string, contentEncoding: binary } }
            audio/mpeg: { schema: { type: string, contentEncoding: binary } }
            text/plain: { schema: { type: string, contentEncoding: binary } }
        '206':
          description: One authorized byte range from scan-clean Asset media, a complete purchased ZIP, or an indexed member. Purchased files are private/no-store attachments.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Range: { schema: { type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$' } }
            Content-Length: { schema: { type: integer, minimum: 1 } }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            application/zip: { schema: { type: string, contentEncoding: binary } }
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            video/mp4: { schema: { type: string, contentEncoding: binary } }
            audio/wav: { schema: { type: string, contentEncoding: binary } }
            audio/mpeg: { schema: { type: string, contentEncoding: binary } }
            text/plain: { schema: { type: string, contentEncoding: binary } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Invalid, unsatisfiable, or multiple byte ranges.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assets/{assetId}/versions:
    post:
