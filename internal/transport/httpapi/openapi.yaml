        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/support/cases/{caseId}/messages:
    post:
      tags: [Admin]
      operationId: replyAdminSupportCase
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/SupportCaseId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportReply' } } } }
      responses:
        '200': { description: Operator reply recorded with notification, content: { application/json: { schema: { $ref: '#/components/schemas/SupportCase' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /health:
    get:
      servers:
        - url: /
      tags: [Runtime]
      operationId: getHealth
      responses:
        '200':
          description: Process health
  /ready:
    get:
      servers:
        - url: /
      tags: [Runtime]
      operationId: getReady
      responses:
        '200':
          description: Dependency readiness
        '503':
          description: A required dependency is unavailable
  /metrics:
    get:
      servers:
        - url: /
      tags: [Runtime]
      operationId: getMetrics
      responses:
        '200':
          description: Low-cardinality Prometheus text metrics for an internal scraper
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Metrics dependencies are unavailable
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hcai_session
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: hcai_sk
  parameters:
    CategoryScope:
      name: scope
      in: query
      description: Task mutations require admin:tasks; community and marketplace mutations require admin:content.
      schema: { type: string, enum: [task, community, marketplace], default: task }
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeveloperAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeveloperKeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DataRightsRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DataRightsHoldId:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupportCaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retain for retries of the same upload, including response loss. Scoped to the authenticated account across ordinary and version uploads. Reuse with changed bytes or fields returns 409; intentionally new uploads use a new key.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    AuthCodeResendLimited:
      description: A request for this email and purpose is in progress or within the resend window. The error code is auth_code_resend_limited; this does not prove email delivery. Retry after the indicated delay.
      headers:
        Retry-After:
          description: Seconds to wait before requesting another code.
          schema: { type: integer, minimum: 1, example: 30 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentRequired:
      description: Available funds are insufficient for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Required provider unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ProductDisputeAction:
      type: string
      enum: [route, request_evidence, record_evidence_submission, escalate_recovery]
    ProductDisputeRoute:
      type: string
      enum: [finance, seller_support, provider_review, collections]
    ProductDisputeActionStatus:
      type: string
      enum: [needs_response, warning_needs_response, under_review, warning_under_review, won, lost, charge_refunded, prevented, requires_review]
    ProductDisputeReviewStatus:
      type: string
      enum: [new, acknowledged, evidence_requested, evidence_submitted, escalated]
    ProductDisputeEvidenceStatus:
      type: string
      enum: [not_requested, requested, submitted]
    ProductPaymentDispute:
      type: object
      required: [id, provider, liveMode, providerDisputeId, providerPaymentId, providerChargeId, amountCents, currency, providerStatus, actionStatus, reviewStatus, reviewRoute, evidenceStatus, bound, dueBy, latestEventAt, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        liveMode: { type: boolean }
        providerDisputeId: { type: string }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        settlementId: { type: string, format: uuid }
        providerPaymentId: { type: string }
        providerChargeId: { type: string }
        amountCents: { type: integer, format: int64 }
        currency: { type: string }
        providerStatus: { type: string }
        actionStatus: { $ref: '#/components/schemas/ProductDisputeActionStatus' }
        reviewStatus: { $ref: '#/components/schemas/ProductDisputeReviewStatus' }
        reviewRoute: { $ref: '#/components/schemas/ProductDisputeRoute' }
        evidenceStatus: { $ref: '#/components/schemas/ProductDisputeEvidenceStatus' }
        bound: { type: boolean }
        productId: { type: string, format: uuid }
        productTitle: { type: string }
        buyerId: { type: string, format: uuid }
        buyerHandle: { type: string }
        buyerDisplayName: { type: string }
        sellerHandle: { type: string }
        sellerDisplayName: { type: string }
        orderStatus: { type: string }
        paymentStatus: { type: string }
        settlementStatus: { type: string }
        dueBy: { type: string, format: date-time }
        latestEventAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductPaymentDisputeEvent:
      type: object
      required: [id, providerEventId, eventType, providerStatus, reason, networkReasonCode, dueBy, occurredAt, applied, createdAt]
      properties:
        id: { type: string, format: uuid }
        providerEventId: { type: string, format: uuid }
        eventType: { type: string }
        providerStatus: { type: string }
        reason: { type: string }
        networkReasonCode: { type: string }
        dueBy: { type: string, format: date-time }
        occurredAt: { type: string, format: date-time }
        applied: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductPaymentDisputeOperation:
      type: object
      required: [id, actorId, actorHandle, actorDisplayName, action, route, reason, expectedVersion, resultingVersion, fromReviewStatus, toReviewStatus, fromEvidenceStatus, toEvidenceStatus, requestId, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorHandle: { type: string }
        actorDisplayName: { type: string }
        action: { $ref: '#/components/schemas/ProductDisputeAction' }
        route: { $ref: '#/components/schemas/ProductDisputeRoute' }
        reason: { type: string }
        evidenceReference: { type: string }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        resultingVersion: { type: integer, format: int64, minimum: 1 }
        fromReviewStatus: { $ref: '#/components/schemas/ProductDisputeReviewStatus' }
        toReviewStatus: { $ref: '#/components/schemas/ProductDisputeReviewStatus' }
        fromEvidenceStatus: { $ref: '#/components/schemas/ProductDisputeEvidenceStatus' }
        toEvidenceStatus: { $ref: '#/components/schemas/ProductDisputeEvidenceStatus' }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    ProductPaymentDisputeEvidence:
      type: object
      required: [id, operationId, submittedBy, submitterHandle, providerReference, submittedAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        submittedBy: { type: string, format: uuid }
        submitterHandle: { type: string }
        providerReference: { type: string }
        submittedAt: { type: string, format: date-time }
    ProductPaymentDisputeDetail:
      allOf:
        - { $ref: '#/components/schemas/ProductPaymentDispute' }
        - type: object
          required: [events, operations, evidenceSubmissions]
          properties:
            events: { type: array, items: { $ref: '#/components/schemas/ProductPaymentDisputeEvent' } }
            operations: { type: array, items: { $ref: '#/components/schemas/ProductPaymentDisputeOperation' } }
            evidenceSubmissions: { type: array, items: { $ref: '#/components/schemas/ProductPaymentDisputeEvidence' } }
    ProductPaymentDisputePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductPaymentDispute' } }
        nextCursor: { type: string }
    ProductPaymentDisputeCommand:
      type: object
      additionalProperties: false
      required: [action, route, expectedVersion, reason, confirmed]
      properties:
        action: { $ref: '#/components/schemas/ProductDisputeAction' }
        route: { $ref: '#/components/schemas/ProductDisputeRoute' }
        evidenceReference: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/#-]{2,499}$', description: Required only for record_evidence_submission; otherwise omitted or empty. Use an opaque receipt reference without credentials or personal data. }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 2000, description: Trimmed Unicode character length; NUL is rejected. }
        confirmed: { type: boolean, const: true }
      description: Action and route are normalized to lowercase; reason and reference are trimmed. escalate_recovery requires collections. A successful operation increments exactly one version; provider outcome and money remain unchanged.
      allOf:
        - if: { properties: { action: { const: record_evidence_submission } } }
          then: { required: [evidenceReference] }
        - if: { properties: { action: { const: escalate_recovery } } }
          then: { properties: { route: { const: collections } } }
    ProductPaymentDisputeCommandResult:
      allOf:
        - { $ref: '#/components/schemas/ProductPaymentDisputeDetail' }
        - type: object
          required: [operationId, replayed]
          properties:
            operationId: { type: string, format: uuid }
            replayed: { type: boolean }
    ContentCategory:
      type: object
      additionalProperties: false
      required: [nameZh, nameEn, icon, sortOrder]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_-]{0,47}$' }
        scope: { type: string, enum: [task, community, marketplace] }
        nameZh: { type: string, minLength: 1, maxLength: 80 }
        nameEn: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string, enum: [image, video, audio, prompt, workflow, mixed] }
        sortOrder: { type: integer, minimum: 0, maximum: 100000 }
    LocalizedSiteText:
      type: object
      required: [enUS, zhCN]
      properties:
        enUS: { type: string, maxLength: 50000 }
        zhCN: { type: string, maxLength: 50000 }
    SitePolicyContent:
      type: object
      required: [terms, privacy, cookies, acceptable, ai, licensing, refunds, copyright]
      properties:
        terms: { $ref: '#/components/schemas/LocalizedSiteText' }
        privacy: { $ref: '#/components/schemas/LocalizedSiteText' }
        cookies: { $ref: '#/components/schemas/LocalizedSiteText' }
        acceptable: { $ref: '#/components/schemas/LocalizedSiteText' }
        ai: { $ref: '#/components/schemas/LocalizedSiteText' }
        licensing: { $ref: '#/components/schemas/LocalizedSiteText' }
        refunds: { $ref: '#/components/schemas/LocalizedSiteText' }
        copyright: { $ref: '#/components/schemas/LocalizedSiteText' }
    SiteConfiguration:
      type: object
      required: [siteName, serverUrl, siteIconUrl, footerText, policies]
      properties:
        siteName: { type: string, minLength: 2, maxLength: 80 }
        serverUrl: { type: string, format: uri, maxLength: 2048 }
        siteIconUrl: { type: string, maxLength: 2048 }
        footerText: { $ref: '#/components/schemas/LocalizedSiteText' }
        policies: { $ref: '#/components/schemas/SitePolicyContent' }
    Meta:
      type: object
      required: [name, environment, defaultLocale, supportedLocales, defaultCurrency, localProvider, paymentProvider, taskPaymentProvider, providerCostReconciliation]
      properties:
        name:
          type: string
        environment:
          type: string
        defaultLocale:
          type: string
        supportedLocales:
          type: array
          items:
            type: string
        defaultCurrency:
          type: string
        localProvider:
          type: object
          required: [enabled, label]
          properties:
            enabled:
              type: boolean
            label:
              type: string
        paymentProvider:
          type: object
          required: [enabled, provider, liveMode]
          properties:
            enabled: { type: boolean }
            provider: { type: string, enum: [stripe, waffo_pancake, epay] }
            liveMode: { type: boolean }
        taskPaymentProvider:
          type: object
          required: [enabled, provider, liveMode]
          properties:
            enabled: { type: boolean }
            provider: { type: string, enum: [stripe, waffo_pancake, epay] }
            liveMode: { type: boolean }
        providerCostReconciliation:
          type: object
          required: [enabled, provider]
          properties:
            enabled: { type: boolean }
            provider: { type: string, enum: [openai] }
    AuthChallenge:
      type: object
      required: [challengeId, purpose, emailHint, expiresAt, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        purpose: { type: string, enum: [login_code, registration_code] }
        emailHint: { type: string }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer, minimum: 1 }
    UnifiedAuthStartRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        locale: { type: string, enum: [en-US, zh-CN] }
    UnifiedAuthStartResponse:
      type: object
      required: [email, accountExists, next]
      properties:
        email: { type: string, format: email }
        accountExists: { type: boolean }
        next: { type: string, enum: [existing_account, registration] }
        challenge: { $ref: '#/components/schemas/AuthChallenge' }
    UnifiedAuthCodeRequest:
      type: object
      additionalProperties: false
      required: [email, purpose]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        purpose: { type: string, enum: [login_code, registration_code] }
        locale: { type: string, enum: [en-US, zh-CN] }
    UnifiedAuthConfirmRequest:
      type: object
      additionalProperties: false
      required: [challengeId, email, code]
      properties:
        challengeId: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    UnifiedAuthRegisterRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code, email, password, handle]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72, description: "At least 10 Unicode characters and at most 72 UTF-8 bytes." }
        handle: { type: string, pattern: '^[a-z0-9_]{3,30}$' }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        locale: { type: string, enum: [en-US, zh-CN] }
        timezone: { type: string, maxLength: 80 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, handle, displayName, locale, timezone]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72, description: "At least 10 Unicode characters and at most 72 UTF-8 bytes." }
        handle: { type: string, pattern: '^[a-z0-9_]{3,30}$' }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        locale: { type: string, enum: [en-US, zh-CN] }
        timezone: { type: string, maxLength: 80 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, password]
