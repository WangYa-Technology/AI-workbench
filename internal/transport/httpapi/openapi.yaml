      responses:
        '200': { description: Private review directory, content: { application/json: { schema: { $ref: '#/components/schemas/SellerPayoutReviewPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/seller-payout-requests/{requestID}:
    parameters:
      - { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin]
      operationId: getSellerPayoutReview
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current request and latest review, content: { application/json: { schema: { $ref: '#/components/schemas/SellerPayoutReviewItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/seller-payout-requests/{requestID}/review:
    parameters:
      - { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: reviewSellerPayout
      security: [{ sessionCookie: [] }]
      description: Records an independent finance decision against an explicit revision and frozen selection. Self-review is forbidden. Rejection cancels an unstarted request and releases its reservation atomically with the audit; approval retains the reservation and does not dispatch funds. An approved review can be superseded by rejection before any source transfer exists. Idempotency is operator-scoped and remains replayable when new payments are disabled, subject to current finance authority.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, settlementId, amountCents, decision, reason]
              properties:
                expectedRevision: { type: integer, minimum: 0, maximum: 2147483646, description: Zero before the first decision; otherwise the latest review revision. }
                settlementId: { type: string, format: uuid }
                amountCents: { type: integer, minimum: 1 }
                bankDestinationId: { type: string, description: Must match the bound bank. Required and nonempty for approval; empty only when rejecting a request with no bank. }
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string, minLength: 10, maxLength: 1000 }
                sellerMessage: { type: string, maxLength: 1000, description: Explicit seller-visible explanation of 10–1000 trimmed Unicode code points required for every new decision. May be absent or empty only when replaying an original pre-0161 decision. Internal reason is never exposed to sellers. }
      responses:
        '200': { description: Durable decision and current request, content: { application/json: { schema: { $ref: '#/components/schemas/SellerPayoutReviewResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/seller-payout-requests/{requestID}/funding:
    post:
      tags: [Admin]
      operationId: admitSellerPayoutFunding
      security: [{ sessionCookie: [] }]
      description: Explicit finance admission of one platform-to-connected-account transfer against the exact latest approval and frozen bank. Requires current independent finance authority and revalidates financial eligibility transactionally. Durably queues one source job; approval alone never queues it. This does not create a bank payout. Replays return the original admission and current request, even when new funding is disabled.
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewId, expectedRevision, settlementId, amountCents, bankDestinationId, reason, confirmed]
              properties:
                reviewId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 1, maximum: 2147483646 }
                settlementId: { type: string, format: uuid }
                amountCents: { type: integer, minimum: 1 }
                bankDestinationId: { type: string }
                reason: { type: string, minLength: 10, maxLength: 1000 }
                confirmed: { type: boolean, enum: [true] }
      responses:
        '200': { description: Durable source admission and current request, content: { application/json: { schema: { $ref: '#/components/schemas/SellerFundingAdmissionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/seller-payout-requests/{requestID}/bank-payout:
    get:
      tags: [Admin]
      operationId: getSellerBankPayoutOperation
      security: [{ sessionCookie: [] }]
      description: Private no-store finance view of current bank command, dispatch and accepted provider status. A queued or successful job and a source transfer are not bank arrival evidence. canSubmit is only a read-time hint; POST rechecks under financial locks.
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current bank operation, content: { application/json: { schema: { $ref: '#/components/schemas/SellerBankPayoutOperation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Admin]
      operationId: submitSellerBankPayout
      security: [{ sessionCookie: [] }]
      description: Explicit bank-payout confirmation after original source funding succeeds. Freezes the original source, approved revision, bank, full USD amount and reason and queues one job in the same transaction. No provider request is made by this endpoint. Current independent finance authority is required on every attempt. Same-key replay returns the original command/job and current operation even when new writes are disabled; it never revives stopped jobs or sends another payout.
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewId, expectedRevision, sourceTransferId, amountCents, bankDestinationId, reason, confirmed]
              properties:
                reviewId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 1, maximum: 2147483646 }
                sourceTransferId: { type: string, format: uuid }
                amountCents: { type: integer, minimum: 1, maximum: 99999999 }
                bankDestinationId: { type: string }
                reason: { type: string, minLength: 10, maxLength: 1000 }
                confirmed: { type: boolean, enum: [true] }
      responses:
        '200': { description: Durable bank command, job and current operation, content: { application/json: { schema: { $ref: '#/components/schemas/SellerBankPayoutSubmission' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
