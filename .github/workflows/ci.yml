name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and inspect runtime executables
        run: |
          for runtime_app in api worker migrate; do
            docker buildx build --load --platform linux/${{ matrix.architecture }} \
              -f deploy/Dockerfile.runtime --build-arg APP="$runtime_app" \
              -t "hcai-chat-$runtime_app:local" .
          done
          make runtime-image-check

  production-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.web -t hcai-chat-web:proxy-test .
      - run: docker pull node:24-alpine
      - run: make proxy-test
        env:
          HCAI_PROXY_TEST_IMAGE: hcai-chat-web:proxy-test

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make security

  verify:
    runs-on: ubuntu-latest
    # Covers the 60-minute Go package budget plus setup, JS tests and lint.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hcai
          POSTGRES_PASSWORD: hcai
          POSTGRES_DB: hcai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcai -d hcai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hcai:hcai@localhost:5432/hcai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            services/waffo-connector/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix services/waffo-connector ci
      - run: make test
      - run: make lint

  marketplace-payment-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hcai
          POSTGRES_PASSWORD: hcai
          POSTGRES_DB: hcai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcai -d hcai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hcai:hcai@localhost:5432/hcai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make e2e-payments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-payment-browser
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  marketplace-isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hcai
          POSTGRES_PASSWORD: hcai
          POSTGRES_DB: hcai_e2e_admin
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U hcai -d hcai_e2e_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_ADMIN_URL: postgres://hcai:hcai@127.0.0.1:55435/hcai_e2e_admin?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Asset and purchased-content failure and recovery contracts
        run: npx playwright test --config playwright.assets-ui.config.ts
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-assets-ui
          path: web/test-results/assets*
          retention-days: 7
      - name: Repeat complete acceptance after owned database and media cleanup
        run: |
          npm --prefix web run test:e2e:marketplace
          npm --prefix web run test:e2e:marketplace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-isolated-browser
          path: web/test-results/marketplace-runs
          retention-days: 7
