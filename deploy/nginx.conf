worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Keep the original route across SPA fallback, but never its query string.
  map $request_uri $request_log_path {
    ~^(?<safe_log_path>[^?]*) $safe_log_path;
    default "";
  }
  log_format hcai_access escape=json
    '{"kind":"http_access","requestId":"$request_id",'
    '"method":"$request_method","path":"$request_log_path","status":"$status",'
    '"bytes":"$body_bytes_sent","durationSeconds":"$request_time",'
    '"upstreamStatus":"$upstream_status","upstreamSeconds":"$upstream_response_time"}';
  access_log /dev/stdout hcai_access;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Native request diagnostics include the raw URL/Referer and cannot be
    # redacted with log_format. Use safe access status/timing for HTTP failures;
    # the main error log above still records startup/process diagnostics.
    error_log /dev/null;

    location = /health {
      proxy_pass http://api:8080/health;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ready {
      proxy_pass http://api:8080/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Match the API's 10 MiB file + 256 KiB multipart envelope. Nginx's
    # default 1 MiB limit otherwise rejects legitimate uploads before the API.
    # Stream private input; authentication and the file limit remain in the API.
    location ~ ^/api/v1/assets/(uploads|[0-9a-fA-F-]+/versions)$ {
      client_max_body_size 10496k;
      client_body_timeout 30s;
      proxy_request_buffering off;
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_send_timeout 30s;
      proxy_read_timeout 60s;
    }

    # Keep private originals, purchased packages and reviewer downloads under
    # the API's streaming/staging budget instead of draining them to proxy disk.
    location ~ ^/api/v1/(assets|admin/products)/[0-9a-fA-F-]+/content$ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 420s;
      send_timeout 30s;
    }

    # Stream only the permission-checked recovery endpoint. Other API body
    # limits and timeouts stay unchanged; the API enforces the exact order size.
    location ~* ^/api/v1/admin/product-deliveries/[0-9a-f-]+/repairs/[0-9a-f-]+/content$ {
      client_max_body_size 100m;
      client_body_timeout 30s;
      proxy_request_buffering off;
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_send_timeout 30s;
      proxy_read_timeout 420s;
    }

    # Private exports may span many storage parts. Stream the verified file
    # without writing account data into proxy response-buffer temp files.
    location ~* ^/api/v1/account/data-rights/[0-9a-f-]+/export$ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 600s;
      send_timeout 30s;
    }

    location /api/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
    }
  }
}
